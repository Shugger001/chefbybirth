<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catering – Large orders and events">
  <meta name="theme-color" content="#2D6A4F">
  <title>Catering – Chef by Birth</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/hero-kenkey.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232D6A4F'/><text y='.9em' x='50%25' text-anchor='middle' font-size='70'>🍲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D97A2B', 'primary-dark': '#B8631F', secondary: '#2D6A4F', 'secondary-dark': '#1B4332', cream: '#FEFAE0', accent: '#E9C46A', 'accent-dark': '#D4A843' }, fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="catering" class="font-body bg-cream text-gray-800 antialiased">
  <div id="layout-header"></div>
  <div id="layout-overlays"></div>
  <main class="page-main">
<section id="catering" class="py-20 md:py-28 bg-secondary text-white">
      <div class="max-w-4xl mx-auto px-4 sm:px-6">
        <div class="text-center mb-10 reveal">
          <span class="text-accent font-semibold uppercase text-sm tracking-wider">Events &amp; Parties</span>
          <h2 class="font-display font-bold text-3xl sm:text-4xl mt-3 mb-4">Catering &amp; Large Orders</h2>
          <p class="text-white/80 max-w-2xl mx-auto">Planning a family gathering, church event, or office lunch? We cater authentic Ghanaian kenkey for groups of 10+. 24–48 hours notice required.</p>
        </div>
        <form id="catering-form" class="reveal bg-white/10 backdrop-blur rounded-2xl p-6 sm:p-8 border border-white/20 space-y-4">
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label for="catering-name" class="block text-sm font-semibold mb-1">Your Name *</label>
              <input type="text" id="catering-name" required class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/50 focus:border-accent focus:ring-2 focus:ring-accent/20">
            </div>
            <div>
              <label for="catering-phone" class="block text-sm font-semibold mb-1">Phone *</label>
              <input type="tel" id="catering-phone" required class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/50 focus:border-accent focus:ring-2 focus:ring-accent/20">
            </div>
            <div>
              <label for="catering-date" class="block text-sm font-semibold mb-1">Event Date *</label>
              <input type="date" id="catering-date" required class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white focus:border-accent focus:ring-2 focus:ring-accent/20">
            </div>
            <div>
              <label for="catering-guests" class="block text-sm font-semibold mb-1">Estimated Guests *</label>
              <input type="number" id="catering-guests" min="10" required placeholder="10+" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/50 focus:border-accent focus:ring-2 focus:ring-accent/20">
            </div>
          </div>
          <div>
            <label for="catering-details" class="block text-sm font-semibold mb-1">Event Details</label>
            <textarea id="catering-details" rows="3" placeholder="Pickup or delivery, menu preferences, dietary needs…" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/50 focus:border-accent focus:ring-2 focus:ring-accent/20"></textarea>
          </div>
          <button type="submit" class="btn-primary w-full sm:w-auto bg-accent hover:bg-accent-dark text-secondary-dark font-bold px-8 py-3.5 rounded-full inline-flex items-center justify-center gap-2">
            <i class="fa-brands fa-whatsapp text-xl"></i> Send Catering Inquiry via WhatsApp
          </button>
        </form>
      </div>
    </section>
  </main>
  <div id="layout-footer"></div>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/layout.js"></script>
  <script>SiteLayout.init();</script>
  <script src="/js/customer.js"></script>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }</script>
</body>
</html>
