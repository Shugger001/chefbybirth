<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Hours & Location – Pickup and delivery in Pennsylvania">
  <meta name="theme-color" content="#2D6A4F">
  <title>Hours & Location – Chef by Birth</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/hero-kenkey.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232D6A4F'/><text y='.9em' x='50%25' text-anchor='middle' font-size='70'>🍲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D97A2B', 'primary-dark': '#B8631F', secondary: '#2D6A4F', 'secondary-dark': '#1B4332', cream: '#FEFAE0', accent: '#E9C46A', 'accent-dark': '#D4A843' }, fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="hours" class="font-body bg-cream text-gray-800 antialiased">
  <div id="layout-header"></div>
  <div id="layout-overlays"></div>
  <main class="page-main">
<section id="hours" class="py-20 md:py-28 bg-white">
      <div class="max-w-4xl mx-auto px-4 text-center">
        <h2 class="font-display font-bold text-3xl text-secondary mb-4 reveal">Hours &amp; Location</h2>
        <div id="live-status" class="inline-flex items-center gap-2 mb-8 px-4 py-2 rounded-full bg-gray-100 text-sm font-semibold" role="status">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></span>
          <span id="status-text">Checking hours…</span>
        </div>
        <div class="grid sm:grid-cols-2 gap-6 text-left">
          <div class="reveal reveal-left bg-cream rounded-2xl p-6 shadow-md hover:shadow-xl transition-shadow">
            <h3 class="font-display font-bold text-secondary mb-3"><i class="fa-solid fa-location-dot text-primary mr-2"></i>Pickup</h3>
            <p id="location-city" class="font-semibold text-lg text-secondary">[CITY], PA</p>
            <p class="text-gray-600 mt-2 text-sm">Delivery within 20 miles · $5 fee or free over $40</p>
          </div>
          <div class="reveal reveal-right bg-cream rounded-2xl p-6 shadow-md hover:shadow-xl transition-shadow text-sm">
            <div id="hours-table" class="space-y-2"></div>
          </div>
        </div>
        <div id="map-wrap" class="hidden reveal mt-8 rounded-2xl overflow-hidden shadow-lg border border-gray-100 h-64 sm:h-80">
          <iframe id="map-embed" title="Chef by Birth location map" class="w-full h-full border-0" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </section>
  </main>
  <div id="layout-footer"></div>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/layout.js"></script>
  <script>SiteLayout.init();</script>
  <script src="/js/customer.js"></script>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }</script>
</body>
</html>
