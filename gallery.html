<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Gallery – From our kitchen">
  <meta name="theme-color" content="#2D6A4F">
  <title>Food Gallery – Chef by Birth</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/hero-kenkey.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232D6A4F'/><text y='.9em' x='50%25' text-anchor='middle' font-size='70'>🍲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D97A2B', 'primary-dark': '#B8631F', secondary: '#2D6A4F', 'secondary-dark': '#1B4332', cream: '#FEFAE0', accent: '#E9C46A', 'accent-dark': '#D4A843' }, fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="gallery" class="font-body bg-cream text-gray-800 antialiased">
  <div id="layout-header"></div>
  <div id="layout-overlays"></div>
  <main class="page-main">
<section id="gallery" class="py-20 md:py-28 bg-white">
      <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="text-center mb-10 reveal">
          <span class="text-primary font-semibold uppercase text-sm tracking-wider">From Our Kitchen</span>
          <h2 class="font-display font-bold text-3xl sm:text-4xl text-secondary mt-3 mb-4">Food Gallery</h2>
          <p class="text-gray-600">Authentic Ghanaian flavors, made fresh every day</p>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
          <div class="gallery-item reveal col-span-2 row-span-2 rounded-2xl overflow-hidden shadow-md">
            <img src="assets/hero-kenkey.png" alt="Traditional Ghanaian kenkey" class="w-full h-full object-cover min-h-[200px] md:min-h-[320px] hover:scale-105 transition-transform duration-500" loading="lazy">
          </div>
          <div class="gallery-item reveal gallery-placeholder rounded-2xl bg-cream flex flex-col items-center justify-center p-6 text-center min-h-[140px] border border-primary/10">
            <span class="text-3xl mb-2">🍗</span><p class="text-sm font-semibold text-secondary">Chofi (6 pcs)</p>
          </div>
          <div class="gallery-item reveal gallery-placeholder rounded-2xl bg-cream flex flex-col items-center justify-center p-6 text-center min-h-[140px] border border-primary/10">
            <span class="text-3xl mb-2">🦃</span><p class="text-sm font-semibold text-secondary">Turkey Wings</p>
          </div>
          <div class="gallery-item reveal gallery-placeholder rounded-2xl bg-cream flex flex-col items-center justify-center p-6 text-center min-h-[140px] border border-primary/10">
            <span class="text-3xl mb-2">🌽</span><p class="text-sm font-semibold text-secondary">3-Day Fermented Kenkey</p>
          </div>
          <div class="gallery-item reveal gallery-placeholder rounded-2xl bg-cream flex flex-col items-center justify-center p-6 text-center min-h-[140px] border border-primary/10">
            <span class="text-3xl mb-2">🔥</span><p class="text-sm font-semibold text-secondary">Homemade Shito</p>
          </div>
        </div>
        <p class="text-center mt-8 text-sm text-gray-500 reveal">Follow <a id="gallery-instagram-link" href="https://instagram.com/chefbybirth" target="_blank" rel="noopener" class="text-primary font-semibold hover:underline">@chefbybirth</a> for daily food photos</p>
      </div>
    </section>
  </main>
  <div id="layout-footer"></div>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/layout.js"></script>
  <script>SiteLayout.init();</script>
  <script src="/js/customer.js"></script>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }</script>
</body>
</html>
