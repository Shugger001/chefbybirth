<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Contact – Phone, WhatsApp, Instagram">
  <meta name="theme-color" content="#2D6A4F">
  <title>Contact Us – Chef by Birth</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/hero-kenkey.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232D6A4F'/><text y='.9em' x='50%25' text-anchor='middle' font-size='70'>🍲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { primary: '#D97A2B', 'primary-dark': '#B8631F', secondary: '#2D6A4F', 'secondary-dark': '#1B4332', cream: '#FEFAE0', accent: '#E9C46A', 'accent-dark': '#D4A843' }, fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="contact" class="font-body bg-cream text-gray-800 antialiased">
  <div id="layout-header"></div>
  <div id="layout-overlays"></div>
  <main class="page-main">
<section id="contact" class="py-20 bg-secondary text-white">
      <div class="max-w-4xl mx-auto px-4 text-center">
        <h2 class="font-display font-bold text-3xl mb-8 reveal">Contact Us</h2>
        <div class="grid sm:grid-cols-3 gap-4">
          <a id="contact-phone" href="tel:+15551234567" class="contact-card reveal stagger-1 bg-white/10 rounded-2xl p-6 hover:bg-white/20 block"><i class="fa-solid fa-phone text-accent text-2xl mb-3 block"></i><p id="contact-phone-text" class="font-semibold">(555) 123-4567</p></a>
          <a id="contact-whatsapp" href="https://wa.me/15551234567" target="_blank" rel="noopener" class="contact-card reveal stagger-2 bg-white/10 rounded-2xl p-6 hover:bg-white/20 block"><i class="fa-brands fa-whatsapp text-[#25D366] text-2xl mb-3 block"></i><p class="font-semibold">WhatsApp</p></a>
          <a id="contact-instagram" href="https://instagram.com/chefbybirth" target="_blank" rel="noopener" class="contact-card reveal stagger-3 bg-white/10 rounded-2xl p-6 hover:bg-white/20 block"><i class="fa-brands fa-instagram text-accent text-2xl mb-3 block"></i><p id="contact-instagram-text" class="font-semibold">@chefbybirth</p></a>
        </div>
      </div>
    </section>
  </main>
  <div id="layout-footer"></div>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/layout.js"></script>
  <script>SiteLayout.init();</script>
  <script src="/js/customer.js"></script>
  <script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {})); }</script>
</body>
</html>
